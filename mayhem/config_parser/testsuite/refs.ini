[settings]
screenchange-reload = true

[global/wm]
margin-top = 5

[bar/x]
modules-right = date
separator = |
tray-position = right
cursor-click = pointer
enable-ipc = true
list-0 = a
list-1 = b
val = ${self.list-0}
ref = ${root.val:fallback}

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
