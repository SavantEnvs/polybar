[bar/fuzz]
width = 100%
height = 24pt
background = #aa222222
foreground = ${colors.fg}
modules-left = a b
font-0 = monospace:size=10;2
offset-x = 50%:-10

[colors]
fg = #fff

[module/a]
type = custom/text
format = <label>
label = "  quoted \"x\"  "
inherit = module/b

[module/b]
label-foreground = ${env:HOME:#f00}
padding = 2px
interval = 1.5
