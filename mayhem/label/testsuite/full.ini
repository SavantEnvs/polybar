[bar/fuzz]
width = 1

[module/fuzz]
label = %a:3:10:...% and %name%
label-foreground = #f00
label-minlen = 5
label-maxlen = 12
label-ellipsis = true
label-alignment = center
label-padding = 2
ramp-0 = a
ramp-1 = b
ramp-2 = c
ramp-foreground = #0f0
animation-0 = x
animation-1 = y
animation-framerate = 500
